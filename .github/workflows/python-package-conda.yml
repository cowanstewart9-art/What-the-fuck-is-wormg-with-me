name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - name: Add conda to system path
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        echo $CONDA/bin >> $GITHUB_PATH
    - name: Auto-create environment.yml if missing
      run: |
        if [ ! -f environment.yml ]; then
          echo "environment.yml not found — generating automatically..."
          cat << 'EOF' > environment.yml
        name: project_env
        channels:
          - conda-forge
          - defaults

        dependencies:
          - python=3.10
          - pip
          - git
          - openssl
          - curl

          - pip:
              - setuptools
              - wheel
              - build
              - requests
              - tqdm
              - colorama
              - flake8
              - black
              - isort
              - python-dotenv
              - -r requirements.txt
        EOF
        else
          echo "environment.yml already exists — using existing file."
        fi
    - name: Update environment
      # The '|| echo...' part catches the failure and prints a message instead of exiting
      run: conda env update --file environment.yml --name base || echo "Conda environment update failed."
    - name: Lint with flake8
      run: |
        conda install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        conda install pytest
        pytest
